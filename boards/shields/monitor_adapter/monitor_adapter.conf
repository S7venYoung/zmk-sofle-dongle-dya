# SPDX-License-Identifier: MIT

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n

CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_SSD1306=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_DONGLE_MONITOR=y
CONFIG_ZMK_DONGLE_MONITOR_CHANNEL=1

# Keep the same DYA display settings and USB serial settings UI.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
