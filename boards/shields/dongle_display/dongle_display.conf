CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# Keep headroom for two LVGL image objects used by the fighter renderer.
CONFIG_LV_Z_MEM_POOL_SIZE=9216
# Reduce the monochrome render buffer while retaining the full display layout.
CONFIG_LV_Z_VDB_SIZE=25

# Separate legacy-format advertising set for Cube telemetry.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

